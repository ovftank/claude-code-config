onboarding = false

[terminal]
default_shell = "pwsh"

[theme]
name = "dracula"
auto_switch = true

[theme.custom]
accent = "#FF79C6"
panel_bg = "#282A36"
sidebar_bg = "#21222C"
active_row_bg = "#44475A"
selection_bg = "#6272A4"
surface_dim = "#21222C"
surface0 = "#44475A"
surface1 = "#6272A4"
overlay0 = "#6272A4"
overlay1 = "#7E88B0"
subtext0 = "#BDC3DE"
text = "#F8F8F2"
mauve = "#BD93F9"
green = "#50FA7B"
yellow = "#F1FA8C"
red = "#FF5555"
blue = "#8BE9FD"
teal = "#A4FFFF"
peach = "#FFB86C"
[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
mouse_scroll_lines = 5
[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    "workspace",
    "tab",
  ],
  [
    { token = "agent", fg = "#50FA7B", bold = true, dim = false },
  ],
]

[keys]
prefix = "f12"
help = ""
settings = ""
new_workspace = ""
new_worktree = ""
open_worktree = ""
remove_worktree = ""
rename_workspace = ""
close_workspace = ""
workspace_picker = ""
goto = ""
detach = ""
reload_config = ""
open_notification_target = ""
previous_workspace = ""
next_workspace = ""
previous_agent = ""
next_agent = ""
focus_agent = ""
remote_image_paste = ""
new_tab = "ctrl+t"
rename_tab = ""
previous_tab = "ctrl+shift+tab"
next_tab = "ctrl+tab"
switch_tab = ""
switch_workspace = ""
close_tab = "ctrl+w"
rename_pane = ""
edit_scrollback = ""
copy_mode = ""
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""
move_tab_previous = ""
move_tab_next = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = ""
split_vertical = ""
split_horizontal = ""
close_pane = ""
zoom = ""
resize_mode = ""
toggle_sidebar = ""

navigate_workspace_up = ""
navigate_workspace_down = ""
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

[keys.indexed]
tabs = "ctrl"
workspaces = "alt"
agents = "ctrl+shift"

[ui.toast]
delivery = "off"

[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 20000000
